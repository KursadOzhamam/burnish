# Burnish — SwiftLint
# CLAUDE.md §15: tum kod Ingilizce, kullaniciya gorunen metin String Catalog'dan gelir.

included:
  - App
  - Packages
  - PrivilegedHelper
  - MenuBarAgent
  - Tests

excluded:
  - "**/.build"
  - "**/DerivedData"
  - "**/*.generated.swift"

disabled_rules:
  - todo                      # TODO'lar §15 uyarinca asama ozetlerinde takip edilir
  - trailing_comma

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - first_where
  - force_unwrapping         # CLAUDE.md §4: silme yapan bir uygulamada crash kabul edilemez
  - implicitly_unwrapped_optional
  - last_where
  - literal_expression_end_indentation
  - modifier_order
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 400
  error: 600

type_body_length:
  warning: 250
  error: 400

function_body_length:
  warning: 50
  error: 100

cyclomatic_complexity:
  warning: 10
  error: 15

identifier_name:
  min_length: 2
  excluded: [id, db, os, up, x, y, i, j, ok, to]

type_name:
  min_length: 3

nesting:
  type_level: 2

custom_rules:
  no_direct_remove_item:
    name: "Dogrudan removeItem yasak"
    regex: 'FileManager\s*(\.\s*default)?\s*\.\s*removeItem'
    message: "CLAUDE.md §4: tum silme islemleri SafetyKit/DeletionService uzerinden gecer. Dogrudan removeItem cagrilmaz."
    severity: error
    match_kinds: [identifier]

  no_print:
    name: "print yerine os.Logger"
    regex: '(^|[^\w.])print\('
    message: "CLAUDE.md §2: loglama os.Logger ile yapilir."
    severity: warning

  no_hardcoded_user_string:
    # Warning, not error: #Preview bodies legitimately use literals, and SwiftLint
    # custom rules cannot be scoped to a macro block. Real views must still use the
    # String Catalog (CLAUDE.md §15).
    name: "Kullaniciya gorunen metin String Catalog'dan gelir"
    regex: 'Text\("(?![A-Za-z0-9_.]+\")[^"]{3,}"\)'
    message: "CLAUDE.md §15: kullaniciya gorunen metinler LocalizedStringKey/String Catalog uzerinden saglanir."
    severity: warning

  no_shell_in_helper:
    name: "Kabuk komutu yasak"
    # Negative lookbehind on the C `system(` call so SwiftUI's `Font.system(...)` and
    # `Image(systemName:)` do not match.
    regex: '(\bNSTask\b|\bProcess\s*\(|/bin/sh\b|/bin/bash\b|/usr/bin/env\b|(?<![\w.])system\s*\()'
    message: "CLAUDE.md §10.8: rastgele kabuk komutu calistirilmaz, ozellikle helper icinde. Gerekiyorsa once onay al."
    severity: error

# Yalnizca `swiftlint analyze` ile calisir (derleme gunlugu gerektirir).
analyzer_rules:
  - unused_import
  - unused_declaration

reporter: "xcode"
