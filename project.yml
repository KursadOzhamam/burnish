# XcodeGen manifest — this file is the source of truth; Burnish.xcodeproj is generated and
# gitignored. Declarative here means no pbxproj merge conflicts as the module count grows
# (CLAUDE.md §17).
#
# Regenerate with:  xcodegen generate

name: Burnish

options:
  bundleIdPrefix: com.burnish
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    # CLAUDE.md §2: Swift 6 strict concurrency.
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_UPCOMING_FEATURE_CONCISE_MAGIC_FILE: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # §13.2: Hardened Runtime on, App Sandbox off.
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    # No signing identity on this machine yet (§1.2); release signing arrives with Developer ID.
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      GCC_OPTIMIZATION_LEVEL: "0"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  CoreKit:
    path: Packages/CoreKit
  DesignSystem:
    path: Packages/DesignSystem
  SafetyKit:
    path: Packages/SafetyKit
  SafetyKitMac:
    path: Packages/SafetyKitMac
  ScanEngine:
    path: Packages/ScanEngine
  Licensing:
    path: Packages/Licensing
  SystemMonitor:
    path: Packages/SystemMonitor
  CoreKitMac:
    path: Packages/CoreKitMac
  Cleanup:
    path: Packages/Features/Cleanup
  History:
    path: Packages/Features/History
  Files:
    path: Packages/Features/Files
  DeletionUI:
    path: Packages/DeletionUI
  HelperProtocol:
    path: Packages/HelperProtocol
  Performance:
    path: Packages/Features/Performance
  Protection:
    path: Packages/Features/Protection
  Applications:
    path: Packages/Features/Applications
  Dashboard:
    path: Packages/Features/Dashboard
  SmartScan:
    path: Packages/Features/SmartScan

targets:
  BurnishHelper:
    type: tool
    platform: macOS
    sources:
      - path: PrivilegedHelper/Sources/BurnishHelper
    settings:
      base:
        PRODUCT_NAME: BurnishHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.burnish.app.helper
        SKIP_INSTALL: YES
        # An XPC service started by launchd: no Info.plist of its own, identified by the one
        # embedded in the binary so its signature carries the identifier (CLAUDE.md §7).
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        INFOPLIST_FILE: PrivilegedHelper/Info.plist
    dependencies:
      - package: HelperProtocol
        product: HelperProtocol
      - package: ScanEngine
        product: ScanEngine
      - package: SafetyKit
        product: SafetyKit
      - package: SafetyKitMac
        product: SafetyKitMac
      - package: CoreKit
        product: CoreKit

  Burnish:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: PrivilegedHelper/com.burnish.app.helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    settings:
      base:
        PRODUCT_NAME: Burnish
        PRODUCT_BUNDLE_IDENTIFIER: com.burnish.app
        # §15: the product name reaches code only through Info.plist and the String Catalog.
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Burnish
        CFBundleDisplayName: Burnish
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        # Turkish and English, per §6.9.
        CFBundleLocalizations: [en, tr]
        CFBundleDevelopmentRegion: en
    dependencies:
      - package: CoreKit
        product: CoreKit
      - package: DesignSystem
        product: DesignSystem
      - package: SafetyKit
        product: SafetyKit
      - package: SafetyKitMac
        product: SafetyKitMac
      - package: ScanEngine
        product: ScanEngine
      - package: Licensing
        product: Licensing
      - package: SystemMonitor
        product: SystemMonitor
      - package: Dashboard
        product: Dashboard
      - package: SmartScan
        product: SmartScan
      - package: CoreKitMac
        product: CoreKitMac
      - package: Cleanup
        product: Cleanup
      - package: History
        product: History
      - package: Files
        product: Files
      - package: DeletionUI
        product: DeletionUI
      - package: Applications
        product: Applications
      - package: Performance
        product: Performance
      - package: Protection
        product: Protection
      - package: HelperProtocol
        product: HelperProtocol
      - target: BurnishHelper
        embed: true
        copy:
          destination: executables

schemes:
  Burnish:
    build:
      targets:
        Burnish: all
    run:
      config: Debug
    archive:
      config: Release
